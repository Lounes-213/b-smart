name: Build Mobile APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: true
        default: "v0.48.2"
      create_release:
        description: "Create or update GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-mobile-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pnpm install --frozen-lockfile
      - name: Build Standalone APK
        run: bash apps/mobile/scripts/build-android-local.sh arm64-v8a production
      - name: Verify APK Output
        run: |
          test -f apps/mobile/build-output/bs-mobile.apk
          ls -lh apps/mobile/build-output/bs-mobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bs-mobile-apk
          path: apps/mobile/build-output/bs-mobile.apk
      - name: Upload to GitHub Release
        if: ${{ inputs.create_release != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$TAG" || gh release create "$TAG" --title "b smart $TAG — Standalone Release" --notes "Official standalone bs-mobile.apk (69 MB) release built directly from repository files."
          gh release upload "$TAG" "apps/mobile/build-output/bs-mobile.apk#bs-mobile.apk" --clobber
          gh release upload "desktop-latest" "apps/mobile/build-output/bs-mobile.apk#bs-mobile.apk" --clobber || true
