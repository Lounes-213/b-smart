<svg xmlns="http://www.w3.org/2000/svg" viewBox="35.3 -376 511.9 409" role="img" aria-label="b smart" aria-labelledby="title">
  <title id="title">b smart</title>
  <defs>
      <path id="b-stem" d="M 96 -320 L 96 -40"/>
      <circle id="b-bowl" cx="190" cy="-108" r="93"/>
      <path id="s-spine" d="M 452 -186C 452 -230 352 -228 352 -186C 352 -148 438 -156 438 -104C 438 -60 332 -64 332 -114"/>
      <path id="spark" d="M455 22C458 46 470 57 493 60 470 63 458 74 455 98 452 74 440 63 417 60 440 57 452 46 455 22Z"/>
  </defs>
  <defs>
    <linearGradient id="spark-fill" x1="419" y1="24" x2="491" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/><stop offset="1" stop-color="#0090ff"/>
    </linearGradient>
    <linearGradient id="back-fill" x1="40" y1="-350" x2="440" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3d3d3d"/><stop offset=".5" stop-color="#222222"/><stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="front-fill" x1="40" y1="-350" x2="440" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4a4a4a"/><stop offset=".5" stop-color="#2a2a2a"/><stop offset="1" stop-color="#0d0d0d"/>
